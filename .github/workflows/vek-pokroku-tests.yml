name: Věk pokroku – tests
on:
  push:
    branches:
      - claude/realistic-3d-strategy-ynyqjy
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python release tests
        run: python -m unittest discover -s strategie/tests -p 'test_*.py'
      - name: Node simulation tests
        run: node --test strategie/tests/*.test.cjs
